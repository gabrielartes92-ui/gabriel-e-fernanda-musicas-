<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mestre dos Dragões - Evolução</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            75% { transform: translateX(5px) rotate(2deg); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }

        @keyframes evolve-flash {
            0%, 100% { filter: brightness(1); box-shadow: 0 0 0px rgba(251, 191, 36, 0); }
            50% { filter: brightness(2.2); box-shadow: 0 0 60px rgba(251, 191, 36, 0.9); }
        }
        .animate-evolve { animation: evolve-flash 0.8s ease-out; }

        #dragon-img { transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col items-center font-sans p-4 justify-between">

    <!-- CABEÇALHO / SELETOR DE ELEMENTOS -->
    <header class="w-full max-w-md bg-[#111827] border border-slate-800/80 rounded-3xl p-4 shadow-2xl flex flex-col gap-3 z-20">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="dragon-title" class="text-lg font-black tracking-wider uppercase text-amber-400">Dragão de Fogo</h1>
                <p id="nivel-texto" class="text-xs font-semibold text-slate-400">Fase: Ovo - Nível 1</p>
            </div>
            <div class="flex items-center space-x-2 bg-[#090d16] py-1.5 px-3 rounded-xl border border-slate-800">
                <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
                <span id="gold-count" class="text-xl font-extrabold text-amber-300 tabular-nums">0</span>
            </div>
        </div>

        <!-- Seletor de Elementos do Jogo -->
        <div class="flex justify-between gap-1 pt-1 border-t border-slate-800">
            <button onclick="mudarElemento('fogo')" id="btn-fogo" class="flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-red-600/30 text-red-400 border border-red-500/30 transition">Fogo</button>
            <button onclick="mudarElemento('tomada')" id="btn-tomada" class="flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-slate-800 text-slate-400 border border-transparent transition">Raio</button>
            <button onclick="mudarElemento('gelo')" id="btn-gelo" class="flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-slate-800 text-slate-400 border border-transparent transition">Gelo</button>
            <button onclick="mudarElemento('luz')" id="btn-luz" class="flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-slate-800 text-slate-400 border border-transparent transition">Luz</button>
            <button onclick="mudarElemento('dark')" id="btn-dark" class="flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-slate-800 text-slate-400 border border-transparent transition">Dark</button>
        </div>
    </header>

    <!-- ÁREA CENTRAL DO DRAGÃO -->
    <main class="flex-1 flex flex-col items-center justify-center w-full max-w-lg my-2">
        <div id="dragon-container" onclick="interagirComDragao()" class="group relative w-64 h-64 md:w-72 md:h-72 flex items-center justify-center rounded-3xl bg-gradient-to-t from-slate-900/40 to-transparent border-2 border-slate-800 cursor-pointer transition-all duration-300 hover:border-amber-500/30 shadow-2xl">
            <div id="dragon-glow" class="absolute inset-0 rounded-3xl opacity-30 group-hover:opacity-50 transition duration-500 blur-xl bg-gradient-to-b from-amber-500 to-transparent"></div>
            <img id="dragon-img" src="assets/ovofogo.png" alt="Dragão" class="relative z-10 max-h-[85%] max-w-[85%] object-contain drop-shadow-2xl animate-float">
        </div>
        <p class="text-[11px] text-indigo-300 mt-3 italic opacity-70 animate-pulse">Toque no dragão para coletar Ouro e Experiência!</p>
    </main>

    <!-- PAINEL INFERIOR (XP E BOTÃO) -->
    <footer class="w-full max-w-md bg-[#111827] border border-slate-800/80 rounded-3xl p-4 shadow-2xl z-20 space-y-3">
        <div class="space-y-1">
            <div class="flex justify-between text-xs font-semibold text-slate-300">
                <span>Progresso da Evolução</span>
                <span id="xp-text" class="text-amber-300 tabular-nums">0 / 100</span>
            </div>
            <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800">
                <div id="xp-bar-fill" class="bg-gradient-to-r from-amber-400 to-red-500 h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
        </div>

        <button onclick="treinarDragao()" class="w-full bg-gradient-to-r from-amber-500 to-red-600 hover:from-amber-600 hover:to-red-700 text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition active:scale-[0.98] flex items-center justify-center space-x-2 text-sm">
            <i class="fa-solid fa-bolt"></i>
            <span>Treinar / Alimentar Dragão (+XP)</span>
        </button>
    </footer>

    <!-- LÓGICA DO JOGO -->
    <script>
        // Estado por elemento salvo ou padrão
        let gameState = JSON.parse(localStorage.getItem('mestre_dragoes_save')) || {
            elementoAtual: 'fogo',
            elementos: {
                fogo: { nivel: 1, xp: 0, nextXp: 100 },
                tomada: { nivel: 1, xp: 0, nextXp: 100 },
                gelo: { nivel: 1, xp: 0, nextXp: 100 },
                luz: { nivel: 1, xp: 0, nextXp: 100 },
                dark: { nivel: 1, xp: 0, nextXp: 100 }
            },
            gold: 0
        };

        const nomesElementos = {
            fogo: "Dragão de Fogo",
            tomada: "Dragão de Raio",
            gelo: "Dragão de Gelo",
            luz: "Dragão de Luz",
            dark: "Dragão das Sombras"
        };

        function getFaseInfo(nivel) {
            if (nivel < 3) return { index: 1, nome: "Ovo", sufixoOvo: true };
            if (nivel < 6) return { index: 2, nome: "Filhote" };
            if (nivel < 10) return { index: 3, nome: "Jovem" };
            if (nivel < 15) return { index: 4, nome: "Adulto" };
            return { index: 5, nome: "Forma Final" };
        }

        function obterCaminhoImagem(el, nivel) {
            const fase = getFaseInfo(nivel);
            // Mapeamento exato baseado nos nomes que você enviou:
            // Ovo: ovofogo, ovotomada, ovogelo, ovoluz, ovodark.png
            // Filhote: filhotefogo, filhotetomada, filhotegelo (Nota: se luz/dark não tiver filhote, usa padrão ou jovem)
            // Jovem: jovemtomada, jovemfogo, jovemgelo, jovemluz, jovemdark
            // Adulto: adultofogo, adultogelo, adultoluz, adultodark, adultotomada
            // Final: finalfogo, finalgelo, finaldark, finaltomada, finalluz (ou similar)
            
            if (fase.index === 1) {
                if (el === 'dark') return 'assets/ovodark.png.png';
                return `assets/ovo${el}.png`;
            }
            if (fase.index === 2) {
                // Se o arquivo do filhote existir com esse nome:
                return `assets/filhote${el}.png`;
            }
            if (fase.index === 3) {
                return `assets/jovem${el}.png`;
            }
            if (fase.index === 4) {
                return `assets/adulto${el}.png`;
            }
            if (fase.index === 5) {
                if (el === 'tomada') return 'assets/finaltomada.png';
                return `assets/final${el}.png`;
            }
            return `assets/ovo${el}.png`;
        }

        function mudarElemento(el) {
            gameState.elementoAtual = el;
            salvar();
            atualizarUI();
            
            // Atualizar classes visuais dos botões do topo
            ['fogo', 'tomada', 'gelo', 'luz', 'dark'].forEach(e => {
                const btn = document.getElementById(`btn-${e}`);
                if(e === el) {
                    btn.className = "flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-red-600/30 text-red-400 border border-red-500/30 transition";
                } else {
                    btn.className = "flex-1 py-1 text-[10px] uppercase font-bold rounded-lg bg-slate-800 text-slate-400 border border-transparent transition";
                }
            });
        }

        function interagirComDragao() {
            const elData = gameState.elementos[gameState.elementoAtual];
            gameState.gold += 2;
            elData.xp += 10;
            
            checarEvolucao(elData);
            salvar();
            atualizarUI();
            animarClique();
        }

        function treinarDragao() {
            const elData = gameState.elementos[gameState.elementoAtual];
            gameState.gold += 5;
            elData.xp += 25;
            
            checarEvolucao(elData);
            salvar();
            atualizarUI();
            animarClique();
        }

        function checarEvolucao(elData) {
            if (elData.xp >= elData.nextXp) {
                elData.xp -= elData.nextXp;
                elData.nivel++;
                elData.nextXp = Math.floor(elData.nextXp * 1.3);
                
                // Animação especial de evolução
                const img = document.getElementById('dragon-img');
                img.classList.add('animate-evolve');
                setTimeout(() => img.classList.remove('animate-evolve'), 800);
            }
        }

        function animarClique() {
            const container = document.getElementById('dragon-container');
            container.classList.add('animate-shake');
            setTimeout(() => container.classList.remove('animate-shake'), 300);
        }

        function salvar() {
            localStorage.setItem('mestre_dragoes_save', JSON.stringify(gameState));
        }

        function atualizarUI() {
            const el = gameState.elementoAtual;
            const elData = gameState.elementos[el];
            const fase = getFaseInfo(elData.nivel);

            document.getElementById('dragon-title').textContent = nomesElementos[el];
            document.getElementById('nivel-texto').textContent = `Fase: ${fase.nome} - Nível ${elData.nivel}`;
            document.getElementById('gold-count').textContent = gameState.gold;

            document.getElementById('xp-text').textContent = `${elData.xp} / ${elData.nextXp}`;
            const porcentagem = Math.min(100, (elData.xp / elData.nextXp) * 100);
            document.getElementById('xp-bar-fill').style.width = `${porcentagem}%`;

            // Atualiza imagem do dragão buscando na pasta assets
            const imgElement = document.getElementById('dragon-img');
            const novoSrc = obterCaminhoImagem(el, elData.nivel);
            
            if (imgElement.getAttribute('src') !== novoSrc) {
                imgElement.style.opacity = '0';
                setTimeout(() => {
                    imgElement.src = novoSrc;
                    imgElement.style.opacity = '1';
                }, 200);
            }
        }

        // Inicializar o jogo ao carregar a página
        window.onload = () => {
            mudarElemento(gameState.elementoAtual);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mestre dos Dragões 3D - Next-Gen Edition</title>
    <style>
        :root {
            --bg-dark: #030508;
            --panel-bg: rgba(10, 15, 28, 0.85);
            --panel-border: rgba(56, 189, 248, 0.15);
            --panel-border-glow: rgba(244, 63, 94, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --gold: #fbbf24;
            --crystal: #38bdf8;
            --xp: #c084fc;
            --hunger: #4ade80;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            -webkit-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            perspective: 1600px;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background: radial-gradient(circle at 50% 30%, #0d1b3e 0%, #030508 80%);
        }

        /* Sidebar Next-Gen */
        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px;
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            box-shadow: 25px 0 50px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-y: auto;
        }

        h1, h2, h3 { color: var(--text-main); text-align: center; }
        h1 { 
            font-size: 1.5em; 
            margin-bottom: 4px; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 0 0 25px rgba(244, 63, 94, 0.7); 
        }

        /* Palco 3D do Dragão com Iluminação Avançada */
        .dragon-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transform-style: preserve-3d;
            transition: transform 0.1s cubic-bezier(0.1, 0.7, 0.3, 1);
            cursor: pointer;
            padding: 20px;
            border-radius: 36px;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), 0 30px 60px rgba(0,0,0,0.6);
            margin: 8px 0;
            width: 100%;
            max-width: 520px;
            min-height: 220px;
            position: relative;
        }

        .dragon-sprite {
            font-size: 115px;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 35px 25px rgba(0,0,0,0.95)) drop-shadow(0 0 35px rgba(244, 63, 94, 0.4));
            transform: translateZ(60px);
            animation: idleDragon 3s ease-in-out infinite alternate;
        }

        @keyframes idleDragon {
            0% { transform: translateZ(60px) translateY(0) rotate(0deg); }
            100% { transform: translateZ(70px) translateY(-8px) rotate(1deg); }
        }

        .dragon-sprite:active { 
            transform: translateZ(20px) scale(0.85) rotate(-2deg); 
        }

        .evolution-title {
            font-size: 0.95em;
            color: var(--gold);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 10px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
            transform: translateZ(40px);
            text-align: center;
        }

        /* Elementos Visuais Dinâmicos da Caverna */
        .lair-decor {
            position: absolute;
            bottom: 12px;
            display: flex;
            gap: 10px;
            font-size: 1.3em;
            transform: translateZ(50px);
            opacity: 0.95;
            pointer-events: none;
            max-width: 85%;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Textos Flutuantes Next-Gen */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.2em;
            color: var(--gold);
            pointer-events: none;
            animation: floatUpCustom 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 1000;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 15px var(--gold);
        }
        @keyframes floatUpCustom {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { transform: translateY(-15px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-75px) scale(1); opacity: 0; }
        }

        /* Painéis de Status com Glassmorphism */
        .stat-group { 
            background: rgba(15, 23, 42, 0.75); 
            border: 1px solid var(--panel-border);
            padding: 12px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .stat-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; font-size: 0.85em; }
        
        .bar-bg { width: 100%; height: 9px; background-color: #020617; border-radius: 6px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.03); }
        .bar-fill { height: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 6px; position: relative; }
        
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .c-gold { color: var(--gold); text-shadow: 0 0 12px rgba(251, 191, 36, 0.5); }
        .c-crystal { color: var(--crystal); text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
        .bg-xp { background: linear-gradient(90deg, #7e22ce, var(--xp)); box-shadow: 0 0 12px var(--xp); }
        .bg-hunger { background: linear-gradient(90deg, #15803d, var(--hunger)); box-shadow: 0 0 12px var(--hunger); }

        /* Botões Estilizados AAA */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 520px; margin-top: 8px; }
        .btn-full { grid-column: span 2; }
        
        button {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 11px;
            font-size: 0.85em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            box-shadow: 0 6px 0 #020617, 0 8px 16px rgba(0,0,0,0.5);
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }

        button:hover:not(:disabled) { 
            background: linear-gradient(145deg, #334155, #1e293b);
            border-color: var(--primary);
            box-shadow: 0 6px 0 #020617, 0 12px 24px rgba(244, 63, 94, 0.35);
            transform: translateY(-2px);
        }
        
        button:active:not(:disabled) { 
            box-shadow: 0 2px 0 #020617, 0 4px 8px rgba(0,0,0,0.5);
            transform: translateY(3px);
        }
        
        button:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: translateY(4px); filter: grayscale(0.5); }
        button .cost { font-size: 0.75em; color: var(--gold); }

        /* Notificações Toasts Next-Gen */
        #toast-container { position: fixed; top: 16px; right: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; align-items: center; }
        .toast {
            background: rgba(13, 18, 31, 0.95); 
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 6px solid var(--primary); 
            color: white;
            padding: 12px 20px; 
            border-radius: 10px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            backdrop-filter: blur(16px);
            animation: slideInCustom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOutCustom 0.4s ease-in 2.6s forwards;
            font-size: 0.9em;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        @keyframes slideInCustom { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOutCustom { from { opacity: 1; } to { opacity: 0; transform: scale(0.95); } }

        /* Abas Elegantes */
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; max-width: 520px; justify-content: center; }
        .tab { 
            flex: 1;
            padding: 9px 10px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--panel-border);
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85em;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .tab.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 20px rgba(244, 63, 94, 0.5); }
        
        .tab-content { display: none; width: 100%; max-width: 520px; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }

        .ach-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            backdrop-filter: blur(8px);
        }
        .ach-item.unlocked { border-color: var(--gold); background: rgba(251, 191, 36, 0.08); box-shadow: 0 0 15px rgba(251, 191, 36, 0.15); }

        /* Layout Responsivo Celulares & Safari */
        @media (max-width: 850px) {
            body {
                flex-direction: column;
                height: 100dvh;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 230px;
                border-right: none;
                border-bottom: 1px solid var(--panel-border);
                flex-shrink: 0;
            }
            .main-content {
                flex: 1;
                overflow-y: visible;
                height: auto;
                min-height: auto;
            }
            .dragon-stage {
                min-height: 190px;
            }
            .dragon-sprite {
                font-size: 95px;
            }
        }
    </style>
</head>
<body>

    <!-- PAINEL LATERAL DE STATUS E SALVAMENTO -->
    <div class="sidebar">
        <h2>🐉 Império 3D</h2>
        
        <div class="stat-group">
            <div class="stat-header">
                <span>Ouro:</span>
                <span class="c-gold" id="ui-gold">0</span>
            </div>
            <div class="stat-header">
                <span>Cristais:</span>
                <span class="c-crystal" id="ui-crystal">0</span>
            </div>
            <div class="stat-header" style="color: var(--text-muted); font-size: 0.75em;">
                <span id="ui-gps">0 Ouro/seg</span>
            </div>
        </div>

        <div class="stat-group">
            <div class="stat-header">
                <span>Nível <span id="ui-level">1</span></span>
                <span id="ui-xp-text">0 / 100 XP</span>
            </div>
            <div class="bar-bg"><div class="bar-fill bg-xp" id="ui-xp-bar" style="width: 0%"></div></div>
        </div>

        <div class="stat-group">
            <div class="stat-header">
                <span>Fome</span>
                <span id="ui-hunger-text">100%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill bg-hunger" id="ui-hunger-bar" style="width: 100%"></div></div>
        </div>

        <div class="stat-group">
            <div class="stat-header"><span>Poder de Clique:</span> <span id="ui-click-power">1</span></div>
            <div class="stat-header"><span>Kobolds Mineiros:</span> <span id="ui-miners">0</span></div>
            <div class="stat-header"><span>Cliques Totais:</span> <span id="ui-total-clicks">0</span></div>
            <br>
            <button class="btn-full" onclick="saveGame(true)" style="background: linear-gradient(145deg, #059669, #047857); box-shadow: 0 5px 0 #022c22;">💾 Salvar Jogo Manual</button>
            <div style="display:flex; gap: 6px; margin-top: 6px;">
                <button onclick="exportSave()" style="background:#3b82f6; flex:1; box-shadow: 0 4px 0 #1e3a8a;">📤 Exportar</button>
                <button onclick="importSave()" style="background:#8b5cf6; flex:1; box-shadow: 0 4px 0 #4c1d95;">📥 Importar</button>
            </div>
            <button class="btn-full" onclick="resetGame()" style="background: linear-gradient(145deg, #dc2626, #b91c1c); box-shadow: 0 5px 0 #450a0a; margin-top: 6px;">⚠️ Resetar Jogo</button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">
        <h1>Mestre dos Dragões</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('caverna')">Caverna</div>
            <div class="tab" onclick="switchTab('loja')">Loja & Magias</div>
            <div class="tab" onclick="switchTab('conquistas')">Conquistas</div>
        </div>

        <!-- ABA: CAVERNA -->
        <div id="caverna" class="tab-content active">
            <div class="dragon-stage" id="stage" onclick="clickDragon(event)">
                <div class="dragon-sprite" id="dragon-emoji">🥚</div>
                <div class="evolution-title" id="evolution-title">Estágio I: Ovo Misterioso</div>
                <div class="lair-decor" id="lair-decor"></div>
            </div>

            <div class="btn-grid">
                <button onclick="feedDragon()" id="btn-feed">
                    🍖 Alimentar Dragão
                    <span class="cost">Custo: 15 Ouro</span>
                </button>
                <button onclick="trainDragon()" id="btn-train">
                    ⚔️ Treinamento Feroz
                    <span class="cost">Custo: 50 Ouro</span>
                </button>
            </div>
        </div>

        <!-- ABA: LOJA E MAGIAS -->
        <div id="loja" class="tab-content">
            <div class="btn-grid" style="width: 100%;">
                <button class="btn-full" onclick="castFury()" id="btn-fury" style="background: linear-gradient(145deg, #d97706, #b45309);">
                    🔥 Ativar Fúria Dracônica (2x Ouro por 30s)
                    <span class="cost">Custo: 200 Ouro</span>
                </button>
                <button class="btn-full" onclick="buyClickUpgrade()" id="btn-upg-click">
                    🖱️ Afiar Garras (+1 Poder de Clique)
                    <span class="cost" id="cost-click">Custo: 50 Ouro</span>
                </button>
                <button class="btn-full" onclick="buyMiner()" id="btn-upg-miner">
                    ⛏️ Contratar Kobold Mineiro (+1 Ouro/seg)
                    <span class="cost" id="cost-miner">Custo: 100 Ouro</span>
                </button>
                <button class="btn-full" onclick="buySuperFood()" id="btn-upg-super">
                    💎 Fruta Dracônica Mágica (Enche Fome 100%)
                    <span class="cost c-crystal">Custo: 1 Cristal</span>
                </button>
            </div>
        </div>

        <!-- ABA: CONQUISTAS -->
        <div id="conquistas" class="tab-content" style="max-height: 380px; overflow-y: auto;">
            <div id="achievements-list" style="width: 100%;"></div>
        </div>

        <div id="toast-container"></div>
    </div>

    <script>
        // Sistema de Áudio Sintetizado Avançado (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'buy') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'level') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(261.63, now);
                osc.frequency.setValueAtTime(329.63, now + 0.1);
                osc.frequency.setValueAtTime(392.00, now + 0.2);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // Parallax 3D adaptado para toque e mouse
        const stage = document.getElementById('stage');
        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            stage.style.transform = `rotateX(${(-y / 12).toFixed(2)}deg) rotateY(${(x / 12).toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;
        });
        stage.addEventListener('mouseleave', () => {
            stage.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });

        // Estado Completo do Jogo
        const defaultState = {
            gold: 0,
            crystals: 0,
            totalClicks: 0,
            furyActive: false,
            furyTimeLeft: 0,
            dragon: { level: 1, xp: 0, hunger: 100 },
            stats: { clickPower: 1, autoMiners: 0 },
            costs: { clickUpgrade: 50, minerUpgrade: 100 },
            achievements: { click50: false, gold1000: false, level10: false },
            lastSavedTime: Date.now()
        };

        let game = JSON.parse(JSON.stringify(defaultState));

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (type === 'error') toast.style.borderLeftColor = '#dc2626';
            if (type === 'success') toast.style.borderLeftColor = '#059669';
            if (type === 'legendary') toast.style.borderLeftColor = '#9333ea';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        // Texto Flutuante Dinâmico de Partículas
        function spawnFloatingText(text, x, y, isCrit = false) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            if (isCrit) {
                el.style.color = '#ef4444';
                el.style.fontSize = '1.4em';
            }
            el.style.left = `${Math.min(window.innerWidth - 90, Math.max(20, x - 25))}px`;
            el.style.top = `${Math.max(60, y - 45)}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 750);
        }

        function updateVisuals() {
            const emoji = document.getElementById('dragon-emoji');
            const title = document.getElementById('evolution-title');
            const lvl = game.dragon.level;

            if (lvl >= 40) {
                emoji.innerText = "🌌🐉";
                title.innerText = "Estágio VII: Dragão Cósmico Ancião";
            } else if (lvl >= 30) {
                emoji.innerText = "👑🐲";
                title.innerText = "Estágio VI: Imperador dos Dragões";
            } else if (lvl >= 20) {
                emoji.innerText = "🔥🐉";
                title.innerText = "Estágio V: Dragão Feroz Majestoso";
            } else if (lvl >= 10) {
                emoji.innerText = "🐲✨";
                title.innerText = "Estágio IV: Dragão Jovem Alado";
            } else if (lvl >= 5) {
                emoji.innerText = "⚡🦎";
                title.innerText = "Estágio III: Draconato Ativo";
            } else if (lvl >= 2) {
                emoji.innerText = "🦎";
                title.innerText = "Estágio II: Lagartinho Curioso";
            } else {
                emoji.innerText = "🥚";
                title.innerText = "Estágio I: Ovo Misterioso";
            }

            let decorHTML = "";
            if (game.gold >= 300) decorHTML += "<span>💰</span>";
            if (game.gold >= 1500) decorHTML += "<span>📦</span>";
            if (game.gold >= 5000) decorHTML += "<span>💎</span>";
            if (game.crystals >= 5) decorHTML += "<span>🔮</span>";
            if (game.stats.autoMiners > 0) {
                let minersCount = Math.min(6, game.stats.autoMiners);
                for(let i=0; i<minersCount; i++) {
                    decorHTML += "<span>⛏️</span>";
                }
            }
            document.getElementById('lair-decor').innerHTML = decorHTML;
        }

        const achievementsData = [
            { id: 'click50', title: 'Primeiros Passos', desc: 'Clique 50 vezes', check: () => game.totalClicks >= 50, reward: 2 },
            { id: 'gold1000', title: 'Magnata da Caverna', desc: 'Acumule 1.000 de Ouro', check: () => game.gold >= 1000, reward: 5 },
            { id: 'level10', title: 'Crescimento Rápido', desc: 'Alcance o Nível 10', check: () => game.dragon.level >= 10, reward: 10 }
        ];

        function checkAchievements() {
            achievementsData.forEach(ach => {
                if (!game.achievements[ach.id] && ach.check()) {
                    game.achievements[ach.id] = true;
                    game.crystals += ach.reward;
                    showToast(`Conquista: ${ach.title}! (+${ach.reward} Cristais)`, "legendary");
                }
            });
        }

        function updateAchievementsUI() {
            let html = "";
            achievementsData.forEach(ach => {
                const unlocked = game.achievements[ach.id];
                html += `<div class="ach-item ${unlocked ? 'unlocked' : ''}">
                    <div><strong>${ach.title}</strong><br><small style="color:var(--text-muted);">${ach.desc}</small></div>
                    <div>${unlocked ? '✅ Feito' : `+${ach.reward} 💎`}</div>
                </div>`;
            });
            document.getElementById('achievements-list').innerHTML = html;
        }

        function updateUI() {
            const xpNeeded = game.dragon.level * 100 * Math.pow(1.2, game.dragon.level - 1);
            
            document.getElementById('ui-gold').innerText = Math.floor(game.gold);
            document.getElementById('ui-crystal').innerText = game.crystals;
            document.getElementById('ui-level').innerText = game.dragon.level;
            document.getElementById('ui-click-power').innerText = game.stats.clickPower * (game.furyActive ? 2 : 1);
            document.getElementById('ui-miners').innerText = game.stats.autoMiners;
            document.getElementById('ui-gps').innerText = `${game.stats.autoMiners * (game.furyActive ? 2 : 1)} Ouro/seg`;
            document.getElementById('ui-total-clicks').innerText = game.totalClicks;

            document.getElementById('cost-click').innerText = `Custo: ${Math.floor(game.costs.clickUpgrade)} Ouro`;
            document.getElementById('cost-miner').innerText = `Custo: ${Math.floor(game.costs.minerUpgrade)} Ouro`;

            if (game.furyActive) {
                document.getElementById('btn-fury').innerText = `🔥 Fúria Ativa (${game.furyTimeLeft}s)`;
                document.getElementById('btn-fury').disabled = true;
            } else {
                document.getElementById('btn-fury').innerText = `🔥 Ativar Fúria Dracônica (2x por 30s)`;
                document.getElementById('btn-fury').disabled = game.gold < 200;
            }

            game.dragon.hunger = Math.max(0, Math.min(100, game.dragon.hunger));
            document.getElementById('ui-hunger-text').innerText = `${Math.floor(game.dragon.hunger)}%`;
            const hungerBar = document.getElementById('ui-hunger-bar');
            hungerBar.style.width = `${game.dragon.hunger}%`;
            hungerBar.style.backgroundColor = game.dragon.hunger > 50 ? 'var(--hunger)' : (game.dragon.hunger > 20 ? '#fbbf24' : '#dc2626');

            document.getElementById('ui-xp-text').innerText = `${Math.floor(game.dragon.xp)} / ${Math.floor(xpNeeded)} XP`;
            document.getElementById('ui-xp-bar').style.width = `${Math.min(100, (game.dragon.xp / xpNeeded) * 100)}%`;

            updateVisuals();
            checkAchievements();
            updateAchievementsUI();

            document.getElementById('btn-feed').disabled = game.gold < 15;
            document.getElementById('btn-train').disabled = game.gold < 50 || game.dragon.hunger < 20;
            document.getElementById('btn-upg-click').disabled = game.gold < game.costs.clickUpgrade;
            document.getElementById('btn-upg-miner').disabled = game.gold < game.costs.minerUpgrade;
            document.getElementById('btn-upg-super').disabled = game.crystals < 1;
        }

        // Clique principal
        function clickDragon(e) {
            playSound('click');
            game.totalClicks++;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;

            const isCrit = Math.random() < 0.15;
            const multiplier = isCrit ? 5 : 1;
            const earnedGold = game.stats.clickPower * (game.furyActive ? 2 : 1) * multiplier;
            
            game.gold += earnedGold;
            gainXP(game.stats.clickPower * 0.5 * multiplier);

            spawnFloatingText(`+${earnedGold}${isCrit ? ' (CRIT!)' : ''}`, clientX, clientY, isCrit);
            updateUI();
        }

        function feedDragon() {
            if (game.gold >= 15) {
                game.gold -= 15;
                game.dragon.hunger += 40;
                playSound('buy');
                showToast("Dragão alimentado!", "success");
                updateUI();
            }
        }

        function trainDragon() {
            if (game.gold >= 50 && game.dragon.hunger >= 20) {
                game.gold -= 50;
                game.dragon.hunger -= 20;
                playSound('buy');
                gainXP(150);
                showToast("Treinamento concluído! +150 XP", "success");
                updateUI();
            } else if (game.dragon.hunger < 20) {
                showToast("Dragão faminto demais para treinar!", "error");
            }
        }

        function castFury() {
            if (game.gold >= 200 && !game.furyActive) {
                game.gold -= 200;
                game.furyActive = true;
                game.furyTimeLeft = 30;
                playSound('level');
                showToast("Fúria Dracônica ativada!", "legendary");
                updateUI();
            }
        }

        function gainXP(amount) {
            game.dragon.xp += amount;
            let xpNeeded = game.dragon.level * 100 * Math.pow(1.2, game.dragon.level - 1);

            while (game.dragon.xp >= xpNeeded) {
                game.dragon.xp -= xpNeeded;
                game.dragon.level++;
                game.crystals += 2;
                playSound('level');
                showToast(`EVOLUÇÃO! Nível ${game.dragon.level}! (+2 Cristais)`, "legendary");
                xpNeeded = game.dragon.level * 100 * Math.pow(1.2, game.dragon.level - 1);
            }
        }

        function buyClickUpgrade() {
            if (game.gold >= game.costs.clickUpgrade) {
                game.gold -= game.costs.clickUpgrade;
                game.stats.clickPower += 1;
                game.costs.clickUpgrade *= 1.5;
                playSound('buy');
                showToast("Garras afiadas!", "success");
                updateUI();
            }
        }

        function buyMiner() {
            if (game.gold >= game.costs.minerUpgrade) {
                game.gold -= game.costs.minerUpgrade;
                game.stats.autoMiners += 1;
                game.costs.minerUpgrade *= 1.3;
                playSound('buy');
                showToast("Kobold contratado!", "success");
                updateUI();
            }
        }

        function buySuperFood() {
            if (game.crystals >= 1) {
                game.crystals -= 1;
                game.dragon.hunger = 100;
                playSound('buy');
                showToast("Fome totalmente restaurada!", "legendary");
                updateUI();
            }
        }

        // Sistema de Save Robusto (Local + Export/Import)
        function exportSave() {
            try {
                const data = btoa(encodeURIComponent(JSON.stringify(game)));
                prompt("Copie seu código de salvamento abaixo:", data);
            } catch (e) {
                showToast("Erro ao exportar save.", "error");
            }
        }

        function importSave() {
            const data = prompt("Cole seu código de salvamento aqui:");
            if (data) {
                try {
                    const decoded = JSON.parse(decodeURIComponent(atob(data.trim())));
                    game = decoded;
                    saveGame(false);
                    updateUI();
                    showToast("Save importado com sucesso!", "success");
                } catch(e) {
                    showToast("Código de save inválido ou corrompido!", "error");
                }
            }
        }

        function saveGame(manual = false) {
            try {
                game.lastSavedTime = Date.now();
                localStorage.setItem('dragonRPG_NextGenSave', JSON.stringify(game));
                if (manual) showToast("Jogo salvo com sucesso!", "success");
            } catch (e) {
                if (manual) showToast("Erro ao salvar no navegador.", "error");
            }
        }

        function loadGame() {
            try {
                const savedData = localStorage.getItem('dragonRPG_NextGenSave');
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    game = { 
                        ...defaultState, 
                        ...parsed, 
                        dragon: {...defaultState.dragon, ...(parsed.dragon || {})}, 
                        stats: {...defaultState.stats, ...(parsed.stats || {})}, 
                        costs: {...defaultState.costs, ...(parsed.costs || {})}, 
                        achievements: {...defaultState.achievements, ...(parsed.achievements || {})} 
                    };
                    
                    const now = Date.now();
                    const secondsOffline = Math.floor((now - (game.lastSavedTime || now)) / 1000);
                    
                    if (secondsOffline > 30 && game.stats.autoMiners > 0) {
                        const offlineGold = secondsOffline * game.stats.autoMiners;
                        game.gold += offlineGold;
                        showToast(`Bem-vindo de volta! Seus kobolds mineraram ${offlineGold} Ouro offline.`, "legendary");
                    }
                }
            } catch (e) {
                console.error("Erro ao carregar o save.", e);
            }
            updateUI();
        }

        function resetGame() {
            if(confirm("ATENÇÃO: Deseja apagar todo o seu progresso definitivamente?")) {
                localStorage.removeItem('dragonRPG_NextGenSave');
                game = JSON.parse(JSON.stringify(defaultState));
                updateUI();
                showToast("O universo foi resetado.", "error");
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Loop principal automático (1 segundo)
        setInterval(() => {
            const mult = game.furyActive ? 2 : 1;
            if (game.stats.autoMiners > 0) {
                game.gold += game.stats.autoMiners * mult;
            }
            if (game.dragon.hunger > 0) {
                game.dragon.hunger -= 0.4;
            }
            if (game.furyActive) {
                game.furyTimeLeft--;
                if (game.furyTimeLeft <= 0) {
                    game.furyActive = false;
                    showToast("Fúria encerrada.", "info");
                }
            }
            updateUI();
        }, 1000);

        // Salvamento automático a cada 15 segundos
        setInterval(() => saveGame(false), 15000);

        // Carregar o jogo ao iniciar a janela
        window.onload = loadGame;
    </script>
</body>
</html>

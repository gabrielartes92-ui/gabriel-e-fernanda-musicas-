<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fe & Gabi Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl w-96 text-center border border-gray-700">
        <h1 class="text-2xl font-bold mb-4 text-pink-400">Fe & Gabi Music</h1>
        
        <!-- Capa / Vinil -->
        <div class="relative w-48 h-48 mx-auto mb-6 rounded-full overflow-hidden border-4 border-pink-500 shadow-lg flex items-center justify-center bg-black">
            <div id="vinyl" class="w-full h-full flex items-center justify-center">
                <i class="fa-solid fa-compact-disc text-6xl text-gray-600"></i>
            </div>
        </div>

        <h2 id="song-title" class="text-lg font-semibold truncate">Carregando...</h2>
        <p id="song-artist" class="text-sm text-gray-400 mb-6">Fe & Gabi</p>

        <!-- Elemento de Áudio HTML5 -->
        <audio id="audio-player"></audio>

        <!-- Controles -->
        <div class="flex justify-center items-center space-x-6">
            <button id="prev-btn" class="text-gray-300 hover:text-white text-xl transition"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-btn" class="bg-pink-500 hover:bg-pink-600 text-white w-14 h-14 rounded-full flex items-center justify-center text-xl shadow-lg transition transform hover:scale-105">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>
            <button id="next-btn" class="text-gray-300 hover:text-white text-xl transition"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Substitua com as suas credenciais do Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;

        async function loadPlaylist() {
            try {
                const querySnapshot = await getDocs(collection(db, "musicas"));
                playlist = [];
                querySnapshot.forEach((doc) => {
                    playlist.push(doc.data());
                });
                if (playlist.length > 0) {
                    await loadSong(currentIndex);
                } else {
                    songTitle.textContent = "Nenhuma música encontrada";
                }
            } catch (error) {
                console.error("Erro ao carregar playlist do Firestore:", error);
                songTitle.textContent = "Erro ao carregar dados";
            }
        }

        async function loadSong(index) {
            if (playlist.length === 0) return;
            const song = playlist[index];
            songTitle.textContent = song.title || "Música sem título";
            songArtist.textContent = song.artist || "Fe & Gabi";

            try {
                let audioUrl = song.url;
                // Se utilizar o Firebase Storage por caminho de referência
                if (song.storagePath) {
                    const storageRef = ref(storage, song.storagePath);
                    audioUrl = await getDownloadURL(storageRef);
                }
                audioPlayer.src = audioUrl;
                audioPlayer.load(); // Força o elemento a atualizar a fonte de áudio
            } catch (error) {
                console.error("Erro ao obter URL de download do Firebase Storage:", error);
            }
        }

        async function togglePlay() {
            if (playlist.length === 0) return;

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playIcon.classList.replace('fa-pause', 'fa-play');
            } else {
                try {
                    // O método play() retorna uma Promise que precisa ser tratada
                    await audioPlayer.play();
                    isPlaying = true;
                    playIcon.classList.replace('fa-play', 'fa-pause');
                } catch (error) {
                    console.error("Erro ao reproduzir áudio (bloqueio de autoplay ou CORS):", error);
                }
            }
        }

        playBtn.addEventListener('click', togglePlay);

        nextBtn.addEventListener('click', async () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            await loadSong(currentIndex);
            if (isPlaying) {
                audioPlayer.play().catch(e => console.error(e));
            }
        });

        prevBtn.addEventListener('click', async () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            await loadSong(currentIndex);
            if (isPlaying) {
                audioPlayer.play().catch(e => console.error(e));
            }
        });

        audioPlayer.addEventListener('ended', async () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            await loadSong(currentIndex);
            audioPlayer.play().catch(e => console.error(e));
        });

        loadPlaylist();
    </script>
</body>
</html>
